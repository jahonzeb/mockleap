# ==============================================================================
# MockLeap — Render.com Blueprint Specification (SQLite)
# ==============================================================================
services:
  - type: web
    name: mockleap
    runtime: python
    region: frankfurt
    plan: free
    branch: main
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: SECRET_KEY
        generateValue: true
      - key: TIME_ZONE
        value: Asia/Tashkent
